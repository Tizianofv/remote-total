<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi mezcla</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#888; --accent:#e0a100; --card:#1c1c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 16px; }
  .btn { display:block; width:100%; padding:18px; margin:0 0 10px; font-size:1.1rem; border:0; border-radius:10px; background:var(--card); color:var(--fg); }
  .row { background:var(--card); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row label { display:flex; justify-content:space-between; margin-bottom:8px; }
  .row span { color:var(--muted); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:40px; accent-color:var(--accent); }
  a { color:var(--muted); }
  #err { color:#f66; }
</style>
</head>
<body>
<div id="app"></div>
<p id="err"></p>
<script>
const app = document.getElementById('app');
const err = document.getElementById('err');
const params = new URLSearchParams(location.search);
const mid = params.get('m');

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}

async function choose() {
  const list = await api('/api/musicians');
  app.innerHTML = '<h1>¿Quién eres?</h1>';
  for (const m of list) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = m.name;
    b.onclick = () => { location.search = '?m=' + encodeURIComponent(m.id); };
    app.appendChild(b);
  }
}

async function mix() {
  const data = await api('/api/mix?m=' + encodeURIComponent(mid));
  app.innerHTML = '';
  const h = document.createElement('h1'); h.textContent = 'Mezcla: ' + data.name; app.appendChild(h);
  data.channels.forEach((c, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label');
    const name = document.createElement('b'); name.textContent = c.label;
    const val = document.createElement('span');
    lab.append(name, val);
    const s = document.createElement('input');
    s.type = 'range'; s.min = 0; s.max = 1000;
    s.value = c.value == null ? 0 : Math.round(c.value * 1000);
    val.textContent = c.value == null ? '—' : Math.round(c.value * 100) + '%';
    let timer = null, last = 0;
    const push = () => {
      last = Date.now();
      fetch('/api/set', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ m: mid, c: i, v: s.value / 1000 }) })
        .then(r => { err.textContent = r.ok ? '' : 'Error al enviar'; })
        .catch(() => { err.textContent = 'Sin conexión con el estudio'; });
    };
    s.oninput = () => {
      val.textContent = Math.round(s.value / 10) + '%';
      clearTimeout(timer);
      if (Date.now() - last > 80) push(); else timer = setTimeout(push, 80);
    };
    row.append(lab, s); app.appendChild(row);
  });
  const back = document.createElement('a'); back.href = '/'; back.textContent = 'Cambiar de músico';
  app.appendChild(back);
}

(mid ? mix() : choose()).catch(e => { err.textContent = 'Error: ' + e.message; });
</script>
</body>
</html>

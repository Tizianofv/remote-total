<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181b">
<title>Mi mezcla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Piel de consola RME TotalMix FX. Colores medidos en la captura totalmix.webp (ver comentario en cada token).
   Medido = leído de píxeles de la captura. Aprox = convención visual, no medida. */
:root {
  --ink: #14181b;          /* fondo de la ventana (medido #14181b) */
  --strip: #384147;        /* cuerpo de canal de entrada (medido #384147) */
  --strip-out: #252c2e;    /* cuerpo de canal de salida (medido #252c2e) */
  --edge: #14181b;         /* separación entre canales (aprox, borde oscuro) */
  --text: #d9e1ea;          /* nombre del canal (medido #d9e1ea) */
  --muted: #8694a0;         /* lecturas dB (medido #8694a0) */
  --dim: #5e6567;           /* etiqueta de hardware (medido #5e6567) */
  --well: #313c41;          /* fondo del medidor (medido #313c41) */
  --rail: #32383f;          /* riel del fader (medido #32383f) */
  --green: #2dc337;         /* medidor (medido #2dc337) */
  --yellow: #e8c53a;        /* medidor alto (aprox) */
  --red: #e5533d;           /* medidor en clip (aprox) */
  --orange: #b58c7a;        /* canal seleccionado, marca naranja (medido #b58c7a) */
  --talk: #354756;          /* cabecera azul tipo Talk (medido #354756) */
  --ok: #2dc337;
  --display: "Roboto Condensed", "Arial Narrow", Tahoma, sans-serif;
  --body: "Roboto Condensed", Tahoma, Verdana, sans-serif;
  --mono: "Roboto Mono", Consolas, Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font: 14px/1.4 var(--body); -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#err { color: var(--red); font: 500 13px/1.4 var(--body); text-align: center; margin: 0; min-height: 1em; }
.app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding: 0 16px max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}

/* Barra superior, como la barra de título de TotalMix */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0 -16px; padding: 8px 12px; background: var(--strip-out); border-bottom: 1px solid var(--edge);
}
.brand { font: 700 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
.brand b { font-weight: 700; color: var(--text); }
.status {
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 11px/1 var(--mono); color: var(--text); background: var(--ink);
  border: 1px solid var(--edge); padding: 4px 8px;
}
.status.off .dot { background: var(--red); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.demo { font: 500 11px/1 var(--mono); color: var(--yellow); }

h1 { font: 700 clamp(24px, 8vw, 30px)/1.1 var(--display); margin: 4px 0 0; text-wrap: balance; color: var(--text); }
h1 span { color: var(--orange); }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 40ch; font-size: 14px; }

/* ---- Pantalla 1: elegir rol. Cada tarjeta es una salida de TotalMix ---- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.who {
  position: relative; text-align: left; cursor: pointer; font: inherit; color: var(--text);
  background: var(--strip-out); border: 1px solid var(--edge); border-radius: 0;
  padding: 0 0 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; min-width: 0;
}
.who:hover, .who:focus-visible { border-color: var(--orange); outline: none; }
.who .name { display: block; background: var(--strip); padding: 8px 10px; font: 700 16px/1.1 var(--display); overflow-wrap: anywhere; }
.who .out { font: 400 11px/1.2 var(--mono); color: var(--dim); margin-inline: 10px; }
.who .mini { display: flex; gap: 2px; height: 16px; align-items: flex-end; margin-inline: 10px; }
.who .mini i { flex: 1; background: var(--well); height: 30%; }
.who.busy .mini i { background: var(--green); }
.who .tag { position: absolute; top: 8px; right: 8px; font: 500 10px/1 var(--mono); color: var(--text); background: var(--orange); padding: 2px 4px; }
.hint { font: 400 12px/1.4 var(--mono); color: var(--muted); text-align: center; }

/* ---- Pantalla 2: mezcla ---- */
.mixhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.back {
  background: var(--strip); border: 1px solid var(--edge); color: var(--text); border-radius: 0;
  font: 700 13px/1 var(--display); padding: 9px 12px; cursor: pointer;
}
.back:focus-visible, .back:hover { border-color: var(--orange); outline: none; }
.route { font: 400 12px/1.3 var(--mono); color: var(--muted); margin-top: 6px; }
.route b { color: var(--text); font-weight: 500; }

.strips { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 3px; }
.strips.scroll {
  grid-template-columns: none; grid-auto-flow: column;
  grid-auto-columns: calc((100% - 3px * (var(--n) - 1)) / var(--n));
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
}
.strips.scroll::-webkit-scrollbar { display: none; }
.strips.scroll .strip { scroll-snap-align: start; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pager span { font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pg {
  width: 44px; height: 34px; border-radius: 0; border: 1px solid var(--edge); background: var(--strip);
  color: var(--text); font: 700 20px/1 var(--display); cursor: pointer;
}
.pg:disabled { color: var(--dim); cursor: default; }
.pg:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* Canal de TotalMix: nombre arriba, lectura de dB abajo, medidor a la izquierda y fader */
.strip {
  background: var(--strip); border: 1px solid var(--edge); border-radius: 0;
  padding: 0 0 6px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0; overflow: hidden;
}
.strip.me { outline: 2px solid var(--orange); outline-offset: -2px; }
.strip .label {
  order: -1; background: var(--strip); border-bottom: 1px solid var(--edge);
  padding: 7px 3px 6px; font: 700 14px/1.1 var(--display); text-align: center; color: var(--text);
  overflow-wrap: anywhere; min-height: 44px;
}
.strip.me .label { background: var(--talk); }
.strip .label small { display: block; font: 400 10px/1.2 var(--mono); color: var(--dim); margin-top: 2px; }
.strip .db {
  order: 2; background: var(--ink); border: 1px solid var(--edge); margin: 0 4px;
  padding: 4px 2px; font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text);
  text-align: center; min-width: 0; overflow: hidden; white-space: nowrap;
}
.strip .db small { color: var(--muted); font-weight: 400; font-size: 10px; margin-left: 2px; }
.body { display: flex; justify-content: center; gap: 6px; height: min(52vh, 380px); min-height: 260px; padding: 4px 0 2px; }
.meter { width: 6px; background: var(--well); position: relative; overflow: hidden; flex: none; margin-block: 10px; }
.meter i {
  position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
  background: linear-gradient(to top, var(--green) 0%, var(--green) 72%, var(--yellow) 86%, var(--red) 97%);
  background-size: 100% var(--h, 300px); background-position: bottom;
}
.fader { position: relative; width: 46px; flex: none; touch-action: none; cursor: grab; }
.fader:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.fader .rail { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 4px; transform: translateX(-50%); background: var(--rail); }
.fader .fill { display: none; }
.fader .tick { position: absolute; left: 0; width: 7px; height: 1px; background: var(--muted); }
.fader .tick.zero { width: 14px; background: var(--text); height: 2px; }
.fader .tick b { position: absolute; left: 10px; top: -5px; font: 400 9px/1 var(--mono); color: var(--muted); }
.fader .tick.zero b { color: var(--text); left: 16px; top: -5px; }
.fader .cap {
  position: absolute; left: 4px; right: 4px; height: 26px; margin-bottom: -13px; border-radius: 0;
  background: linear-gradient(180deg, #9aa1a8 0%, #848484 50%, #5f5f5f 100%);
  box-shadow: 0 2px 4px #0008, inset 0 0 0 1px #2a2f35;
}
.fader .cap::after { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: #1d2327; }
.foot { font: 400 11px/1.4 var(--mono); color: var(--dim); text-align: center; margin: 0; }

@media (prefers-reduced-motion: reduce) { .who { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="/app.js"></script>
</body>
</html>

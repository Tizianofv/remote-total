<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi mezcla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Sans:wght@400;600&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;600&display=swap">
<style>
/* Dos piezas. Las TIRAS DE CANAL siguen con la piel de consola RME TotalMix FX (colores medidos en la captura
   de un canal: fader-mic1.png, 75x302 px, y totalmix.webp; "medido" = leído de un píxel; "aprox" = sin medir).
   Lo que rodea las tiras usa la identidad de Caribbean Dream Studios (variables CSS medidas en la web del estudio). */
:root {
  /* ---- Identidad del estudio (rodea las tiras) ---- */
  --bg: oklch(0.11 0.018 255);
  --bg2: oklch(0.15 0.016 255);
  --surface: oklch(0.20 0.014 255);
  --border: oklch(0.28 0.014 255);
  --accent: oklch(0.62 0.20 25);   /* rojo de acento (la web: --gold) */
  --ok: oklch(0.62 0.18 145);      /* verde de "Conectado" */
  --fg: oklch(0.94 0.01 85);       /* texto */
  --fg-dim: oklch(0.65 0.01 85);   /* texto secundario */
  --fg-mute: oklch(0.42 0.01 255); /* texto apagado */
  --f-title: "Barlow Condensed", "Arial Narrow", Tahoma, sans-serif;
  --f-text: "DM Sans", system-ui, -apple-system, Helvetica, Arial, sans-serif;

  /* ---- Piel de consola (solo tiras de canal) ---- */
  --strip: #394147;        /* cuerpo del canal (medido fader-mic1, x=0,y=0) */
  --strip-out: #252c2e;    /* cuerpo de canal de salida (medido totalmix.webp, DRUMMER) */
  --edge: #010101;         /* borde negro entre canales (medido fader-mic1, x=74) */
  --text: #d0dce8;         /* nombre del canal (medido fader-mic1, 22,2) */
  --sub: #637984;          /* etiqueta de hardware (medido fader-mic1, 20,35) */
  --peak: #839dad;         /* lectura de pico (medido fader-mic1, 28,92) */
  --value: #c7c7c8;        /* lectura de fader (medido fader-mic1, 42,291) */
  --scale: #5d737d;        /* números de escala (medido fader-mic1, 14,143) */
  --tick: #697e88;         /* rayitas de escala (medido fader-mic1, 25,144) */
  --well: #313b41;         /* fondo del medidor (medido fader-mic1, 12,120) */
  --rail: #1b2022;         /* riel del fader, centro oscuro (medido fader-mic1, 35,120) */
  --rail-edge: #30383d;    /* borde del riel (medido fader-mic1, 37,120) */
  --valbox: #283136;       /* caja de lectura abajo (medido fader-mic1, 10,285) */
  --green: #19d120;        /* medidor (medido fader-mic1, 11,272) */
  --yellow: #e8c53a;       /* medidor alto (aprox, no medido) */
  --red: #e5533d;          /* medidor en clip (aprox, no medido) */
  --display: "Roboto Condensed", "Arial Narrow", Tahoma, sans-serif;
  --mono: "Roboto Mono", Consolas, Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.4 var(--f-text); -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#err { color: var(--accent); font: 400 13px/1.4 var(--f-text); text-align: center; margin: 0; min-height: 1em; }
.app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding: 0 16px max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}

/* Barra superior, como la barra de título de TotalMix */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0 -16px; padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--border);
}
/* Logo: alto máximo 20 px (proporción intacta); si no cabe, se achica a lo ancho de la barra. */
.brand { flex: 1 1 auto; min-width: 0; }
.brand .logo { display: block; width: auto; height: auto; max-width: 100%; max-height: 20px; }
.status {
  display: inline-flex; align-items: center; gap: 6px;
  font: 400 12px/1 var(--f-text); color: var(--ok); background: var(--bg);
  border: 1px solid var(--border); padding: 5px 9px;
}
.topr { display: flex; align-items: center; gap: 8px; }
.fs {
  display: grid; place-items: center; min-width: 44px; min-height: 40px; padding: 0;
  background: var(--strip); border: 0; border-radius: 0; color: var(--fg); cursor: pointer;
}
.fs svg { display: block; }
.fs:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status.off { color: var(--accent); }
.status.off .dot { background: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
/* Pantalla de mezcla: solo el punto (verde conectado, rojo sin conexión). Mismo ancho que la caja de texto (79,4 px medidos
   en 390x800), alineado a la derecha: la cabecera no se mueve y el hueco queda libre a la izquierda del punto. El texto
   del estado va en aria-label y title (app.js). */
.app.mix .status { width: 80px; height: 24px; padding: 0; border: 0; background: none; justify-content: flex-end; }
.app.mix #stxt { display: none; }
.app.mix .dot { width: 12px; height: 12px; }

h1 {
  font: 800 clamp(24px, 8vw, 30px)/1.1 var(--f-title); text-transform: uppercase; letter-spacing: .04em;
  margin: 4px 0 0; text-wrap: balance; color: var(--fg);
}
.lede { color: var(--fg-dim); margin: 6px 0 0; max-width: 40ch; font: 400 14px/1.4 var(--f-text); }

/* ---- Pantalla 1: elegir rol. Cada tarjeta es una salida de TotalMix ---- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.who {
  position: relative; text-align: left; cursor: pointer; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--border); border-radius: 0;
  padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; min-width: 0;
}
.who:hover, .who:focus-visible, .who:active { border-color: var(--accent); outline: none; }
.who .name { display: block; padding: 0; font: 800 18px/1.1 var(--f-title); text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.who .out { font: 400 12px/1.2 var(--f-text); color: var(--fg-dim); }
.who .mini { display: flex; gap: 2px; height: 16px; align-items: flex-end; margin-inline: 10px; }
.who .mini i { flex: 1; background: var(--well); height: 30%; }
.who.busy .mini i { background: var(--green); }
.hint { font: 400 12px/1.4 var(--f-text); color: var(--fg-dim); text-align: center; }
/* Elegir rol, como la web del estudio: foto oscurecida de fondo, texto rojo pequeño, tarjetas sin borde ni radio. */
.app.pick {
  position: relative; isolation: isolate;
}
.app.pick::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    linear-gradient(to bottom, oklch(0.11 0.018 255 / 0.55), oklch(0.11 0.018 255 / 0.92)),
    url("/estudio-fondo.jpg") center / cover no-repeat,
    oklch(0.11 0.018 255);
}
.kicker {
  font: 600 10px/1.2 var(--f-text); letter-spacing: 2.5px; text-transform: uppercase; color: oklch(0.62 0.20 25);
  margin: 0 0 6px;
}
.pick h1 { font-size: clamp(26px, 9vw, 34px); }
.pick .grid { gap: 10px; }
.pick .who {
  background: oklch(0.15 0.016 255); border: 0; border-left: 2px solid transparent; border-radius: 0;
  padding: 14px 14px 14px 12px; gap: 4px;
}
.pick .who:hover, .pick .who:focus-visible, .pick .who:active {
  border-left-color: oklch(0.62 0.20 25); background: oklch(0.18 0.016 255); outline: none;
}
.pick .who .num {
  display: block; font: 400 56px/0.9 "Cormorant Garamond", Georgia, serif; color: oklch(0.28 0.014 255);
  margin-bottom: 4px;
}
.pick .who .name { font: 600 clamp(22px, 7vw, 28px)/1.05 "Cormorant Garamond", Georgia, serif; text-transform: none; letter-spacing: 0; color: oklch(0.94 0.01 85); }
.pick .who .out { font: 600 10px/1.2 var(--f-text); letter-spacing: 2.5px; text-transform: uppercase; color: oklch(0.62 0.20 25); }
@media (min-width: 560px) {
  .pick .who { padding: 36px 30px 32px 26px; }
}

/* ---- Pantalla 2: mezcla ---- */
.mixhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
/* Botón tipo RESERVAR de la web: DM Sans 600 12px, mayúsculas, espaciado 1.2px, borde y texto rojos, sin fondo */
.back {
  background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 0;
  font: 600 12px/1 var(--f-text); letter-spacing: 1.2px; text-transform: uppercase; padding: 10px 14px; cursor: pointer;
}
.back:focus-visible, .back:hover { outline: 2px solid var(--accent); outline-offset: 2px; }
.route { font: 400 13px/1.3 var(--f-text); color: var(--fg-dim); margin-top: 6px; }
.route b { color: var(--fg); font-weight: 600; }

/* Fila: canales de entrada paginados a la izquierda, salida fija a la derecha (ancho 84 px). */
.rack { display: flex; align-items: stretch; gap: 2px; background: var(--edge); }
.inputs { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.outs { flex: 0 0 84px; width: 84px; min-width: 0; display: flex; }
.outs .strip { flex: 1 1 auto; }
/* Fader FX (retorno de TotalMix) dentro de la salida, a la derecha del fader grande (que llega hasta 64 px).
   Riel fino, capuchón chico con marca verde y valor en dB arriba. Área de toque propia de 20 px. */
.fxf { position: absolute; right: 0; top: 0; bottom: 0; width: 20px; touch-action: none; cursor: grab; }
.fxf:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Medidas de la sala en totalmix-salida-guitarra.png (75x317, píxel a píxel). Riel del FX: canal de 4 px (x 57-60),
   y 108 a 170 = unos 36 % del riel del fader grande (y 108 a 278); en la página es el 50 % del riel grande, en la mitad de abajo
   (corrección de Tiziano: "la mitad inferior del fader del volumen"). Capuchón FX: 13 px de ancho
   por 17 de alto (x 52-64, y 138-154), que es unas 80 % x 65 % del capuchón grande (16 x 26 px). Bordes claros
   #6b808e / #758a99 / #78909f, interior #2d3438, raya verde de 4 x 2 px en el medio. Barra verde de 3 px bajo el
   capuchón (#00ae29, borde #048e24) hasta el final del riel. La pista va en .fxtrack: termina a 10 px del fondo, igual que el riel grande. */
.fxf .fxtrack { position: absolute; left: 0; right: 0; bottom: 17px; height: calc((100% - 20px) * 0.5); }
.fxf .rail { position: absolute; left: 8px; width: 4px; top: 0; bottom: 0; background: #1f2427; }
.fxf .lvl { position: absolute; left: 8px; width: 3px; bottom: 0; height: calc(var(--p, 0) * (100% - 17px)); background: #00ae29; border: 1px solid #048e24; border-width: 0 1px 0 0; box-sizing: border-box; }
.fxf .cap {
  position: absolute; left: 4px; width: 13px; height: 17px; bottom: 0;
  background: #2d3438; border: 1px solid; border-color: #6b808e #758a99 #78909f; box-sizing: border-box;
}
.fxf .cap::after { content: ""; position: absolute; left: 3px; width: 4px; top: 6px; height: 2px; background: #00ae29; }
/* Valor en dB encima del riel (0..10 px) y "FX" debajo del final del riel. */
/* Valor: 10 px de alto, 5 px encima del inicio del riel (la pista empieza en 50% - 7 px). Ancho de 28 px para "−18.0" (sin
   recorte: la tira es de 84 px y el FX es su franja derecha de 20 px). */
.fxf .fxv { position: absolute; left: -8px; right: 0; top: calc(50% - 22px); font: 400 9px/10px var(--mono); text-align: center; color: var(--value); white-space: nowrap; }
.fxf .fxl { position: absolute; left: 0; right: 0; bottom: 0; font: 700 12px/12px var(--display); text-align: center; color: #00ae29; }
.fxf.off { opacity: .35; pointer-events: none; }
.outs .strip.out { background: var(--strip-out); }
.outs .strip.off { opacity: .4; }
.outs .strip.off .body { min-height: 200px; }
.strips { display: grid; gap: 2px; background: var(--edge); }
.strips.scroll {
  grid-template-columns: none; grid-auto-flow: column;
  grid-auto-columns: calc((100% - 2px * (var(--n) - 1)) / var(--n));
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
}
.strips.scroll::-webkit-scrollbar { display: none; }
.strips.scroll .strip { scroll-snap-align: start; }
/* Pocos canales (no hay paginado): cada tira mide lo mismo que en una página llena (--n = canales por página),
   va a la izquierda y el hueco que queda muestra el fondo de la página. */
.strips.fixed {
  grid-auto-flow: column; grid-auto-columns: calc((100% - 2px * (var(--n) - 1)) / var(--n));
  justify-content: start; background: var(--bg);
}
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: 0 0 auto; }
.pager span { font: 400 12px/1 var(--f-text); color: var(--fg-dim); font-variant-numeric: tabular-nums; }
/* Flechas de página: mismo estilo que el botón RESERVAR */
.pg {
  width: 44px; height: 34px; border-radius: 0; border: 1px solid var(--accent); background: transparent;
  color: var(--accent); font: 600 18px/1 var(--f-text); cursor: pointer;
}
.pg:disabled { color: var(--fg-mute); border-color: var(--border); cursor: default; }
.pg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Canal de TotalMix: nombre arriba, medidor y fader con escala, lectura de dB abajo.
   Geometría en px tomada de la captura (75 px de ancho, 302 de alto): medidor x 7-23, escala dentro del medidor
   y a su derecha, riel x 35-37, capuchón x 28-44. */
.strip {
  background: var(--strip); border-right: 1px solid var(--edge); padding: 0 0 2px;
  display: flex; flex-direction: column; align-items: stretch; min-width: 0; overflow: hidden;
}
/* Canal que el músico tocó o movió por última vez (se queda hasta cambiar de rol o recargar). */
.strip.sel { box-shadow: inset 0 0 0 1px var(--accent); }
.strip .label { padding: 4px 2px 0; text-align: center; min-height: 48px; }
.strip .label b { display: block; font: 700 13px/14px var(--display); color: var(--text); overflow-wrap: anywhere; }
.strip .label small { display: block; margin-top: 18px; font: 400 10px/12px var(--mono); color: var(--sub); }
.strip .peak { margin: 41px 0 0 6px; font: 400 12px/14px var(--mono); color: var(--peak); font-variant-numeric: tabular-nums; min-height: 14px; white-space: nowrap; }
.body { position: relative; height: clamp(200px, 50vh, 320px); min-height: 200px; margin-top: 4px; }
.meter { position: absolute; left: 7px; width: 16px; top: 0; bottom: 0; background: var(--well); overflow: hidden; }
.meter i {
  position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
  background: linear-gradient(to top, var(--green) 0%, var(--green) 72%, var(--yellow) 86%, var(--red) 97%);
  background-size: 100% var(--h, 300px); background-position: bottom;
}
/* Rayita de pico retenido: 3 px del mismo verde del medidor, a todo el ancho del pozo (medida en peakhold-drummer.png:
   filas 190-192, x 10-13, color #19d120 igual que el relleno). Se oculta sin señal (app.js). */
.meter .hold { position: absolute; left: 0; right: 0; height: 3px; background: var(--green); display: none; }
/* Zona del fader: va a todo lo alto del canal (el dedo puede tocar en cualquier punto de la altura). */
.fader { position: absolute; left: 20px; width: 44px; top: 0; bottom: 0; touch-action: none; cursor: grab; }
.fader:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fader .rail { position: absolute; left: 14px; width: 4px; top: 10px; bottom: 10px; background: linear-gradient(90deg, var(--rail-edge), var(--rail) 50%, var(--rail-edge)); }
.fader .fill { display: none; }
.fader .tick { position: absolute; left: 4px; width: 7px; height: 1px; background: var(--tick); }
.fader .tick.zero { width: 7px; height: 1px; background: var(--tick); }
.fader .tick b { position: absolute; left: -15px; width: 12px; top: -5px; text-align: center; font: 400 9px/1 var(--mono); color: var(--scale); }
.fader .tick.zero b { color: var(--scale); }
.fader .cap {
  position: absolute; left: 8px; width: 16px; height: 26px; margin-bottom: -13px;
  background: linear-gradient(180deg, #cacaca 0%, #a4a4a4 18%, #444 22%, #aeaeae 30%, #4d4d4d 36%, #cacaca 44%, #858585 60%, #6b6b6b 74%, #141414 80%, #aeaeae 90%, #6b6b6b 100%);
  box-shadow: 0 1px 2px #000a;
}
.strip .db {
  margin: 6px 0 0; background: var(--valbox); border-top: 1px solid var(--edge);
  padding: 2px 4px; font: 400 13px/15px var(--mono); font-variant-numeric: tabular-nums; color: var(--value);
  text-align: center; min-width: 0; overflow: hidden; white-space: nowrap;
}

.foot { font: 400 11px/1.4 var(--f-text); color: var(--fg-mute); text-align: center; margin: 0; }

/* Celular acostado: la mezcla usa todo el ancho y las tiras caben enteras en el alto, sin scroll.
   En vertical no cambia nada. La altura de los faders la da el flujo (flex), así que al girar se recalcula sola. */
@media (orientation: landscape) and (max-height: 500px) {
  .app {
    max-width: none; gap: 6px;
    padding: 6px max(12px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  /* Cabecera en una sola fila: logo, rol y salida, Cambiar, pantalla completa y estado. */
  .app.mix {
    height: 100vh; height: 100dvh;
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-rows: auto minmax(0, 1fr);
    gap: 0 10px;
  }
  .app.mix .top, .app.mix .mixhead { display: contents; }
  .app.mix .brand { grid-column: 1; grid-row: 1; }
  .app.mix .mixhead > div { grid-column: 2; grid-row: 1; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .app.mix h1 { margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .app.mix .route { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .app.mix #back { grid-column: 3; grid-row: 1; padding: 8px 12px; }
  .app.mix .topr { grid-column: 4; grid-row: 1; }
  .app.mix #body { grid-column: 1 / -1; grid-row: 2; min-height: 0; margin-top: 6px; display: flex; flex-direction: column; }
  .app.mix .foot { display: none; }
  .app.mix .rack, .app.mix .inputs { flex: 1 1 auto; min-height: 0; }
  .app.mix .strips { flex: 1 1 0; min-height: 0; }
  .app.mix .body { height: auto; min-height: 0; flex: 1 1 auto; }
  .app.mix .outs .strip.off .body { min-height: 0; }
}

/* Horizontal con la barra del navegador visible (alto de hasta 320 px): cabeza de tira compacta, fader con
   todo el alto que sobra y escala que oculta etiquetas que se montan. DECISIÓN DE LA SALA: el corte es 320 px.
   Es el único sitio donde vive ese 320; fitScale() en app.js lee --scale-fit de aquí, no repite el número.
   Vertical y horizontal de más de 320 px no pasan por este bloque. */
@media (orientation: landscape) and (max-height: 320px) {
  :root { --scale-fit: 1; }
  .app.mix #body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .app.mix .rack, .app.mix .inputs { flex: 1 1 auto; min-height: 0; }
  .app.mix .strips { flex: 1 1 0; min-height: 0; }
  .app.mix .body { height: auto; min-height: 0; flex: 1 1 auto; margin-top: 0; }
  .app.mix .outs .strip.off .body { min-height: 0; }
  .app.mix .strip .label { min-height: 0; padding: 2px 2px 0; }
  .app.mix .strip .label small { margin-top: 0; }
  .app.mix .strip .peak { margin: 2px 0 0 6px; }
  .app.mix .fader .tick b.hid { display: none; }
}

/* Horizontal de 321 a 500 px de alto (celular acostado en pantalla completa): la misma cabeza compacta y el fader
   con todo el alto que sobra, como en el bloque de 320 px de arriba. Vertical y de hasta 320 px no pasan por aquí. */
@media (orientation: landscape) and (min-height: 321px) and (max-height: 500px) {
  :root { --scale-fit: 1; }
  .app.mix #body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .app.mix .rack, .app.mix .inputs { flex: 1 1 auto; min-height: 0; }
  .app.mix .strips { flex: 1 1 0; min-height: 0; }
  .app.mix .body { height: auto; min-height: 0; flex: 1 1 auto; margin-top: 0; }
  .app.mix .outs .strip.off .body { min-height: 0; }
  .app.mix .strip .label { min-height: 0; padding: 2px 2px 0; }
  .app.mix .strip .label small { margin-top: 0; }
  .app.mix .strip .peak { margin: 2px 0 0 6px; }
  .app.mix .fader .tick b.hid { display: none; }
}

@media (prefers-reduced-motion: reduce) { .who { transition: none; } }
</style>
</head>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e22">
<title>Mi mezcla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; }

/* Layout: una sola columna tipo app; en escritorio se centra con ancho de celular. Look oscuro de consola, elegido a propósito (un solo tema). */
:root {
  --ink: #0b0f17;          /* fondo */
  --panel: #131a26;        /* superficie de canal */
  --line: #233047;         /* bordes y escalas */
  --text: #e6edf7;
  --muted: #7d8aa3;
  --accent: #4fd8e8;       /* cian fósforo: selección y faders */
  --hot: #ffb547;          /* medidor alto */
  --clip: #ff5470;         /* medidor en rojo */
  --ok: #4be39a;           /* conectado */
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% -10%, #17324a 0%, var(--ink) 55%) fixed, var(--ink);
  color: var(--text);
  font: 15px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 600 13px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--accent); font-weight: 700; }
.status {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 12px/1 var(--mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px;
}
.status.off .dot { background: var(--clip); box-shadow: 0 0 10px var(--clip); animation: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.demo { font: 500 11px/1 var(--mono); color: var(--hot); letter-spacing: .06em; text-transform: uppercase; }

h1 { font: 700 clamp(30px, 9vw, 40px)/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 40ch; }

/* ---- Pantalla 1: elegir músico ---- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.who {
  position: relative; text-align: left; cursor: pointer;
  background: linear-gradient(180deg, #172131, var(--panel));
  border: 1px solid var(--line); border-radius: 14px; color: var(--text);
  padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px;
  font: inherit; transition: border-color .15s, transform .15s;
}
.who:hover, .who:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-1px); }
.who .name { font: 600 19px/1.1 var(--display); }
.who .out { font: 400 12px/1 var(--mono); color: var(--muted); }
.who .mini { display: flex; gap: 3px; height: 18px; align-items: flex-end; }
.who .mini i { flex: 1; background: var(--line); border-radius: 2px; height: 30%; }
.who.busy .mini i { background: var(--accent); opacity: .55; }
.who .tag { position: absolute; top: 12px; right: 12px; font: 500 10px/1 var(--mono); color: var(--ok); letter-spacing: .08em; }
.hint { font: 400 12px/1.4 var(--mono); color: var(--muted); text-align: center; }

/* ---- Pantalla 2: mi mezcla ---- */
.mixhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.back {
  background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 10px;
  font: 500 13px/1 var(--body); padding: 9px 12px; cursor: pointer;
}
.back:focus-visible, .back:hover { color: var(--text); border-color: var(--accent); outline: none; }
.route { font: 400 12px/1.3 var(--mono); color: var(--muted); margin-top: 6px; }
.route b { color: var(--text); font-weight: 600; }

.strips { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; }
.strips.scroll {
  grid-template-columns: none; grid-auto-flow: column;
  grid-auto-columns: calc((100% - 8px * (var(--n) - 1)) / var(--n));
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
}
.strips.scroll::-webkit-scrollbar { display: none; }
.strips.scroll .strip { scroll-snap-align: start; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: -8px; }
.pager span { font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pg { width: 44px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--accent); font: 600 20px/1 var(--display); cursor: pointer; }
.pg:disabled { color: var(--line); cursor: default; }
.pg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0;
}
.strip.me { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: inset 0 0 24px color-mix(in srgb, var(--accent) 10%, transparent); }
.db { font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.db small { color: var(--muted); font-weight: 400; font-size: 10px; margin-left: 2px; }
.body { display: flex; gap: 10px; height: min(46vh, 340px); min-height: 240px; }
.meter { width: 6px; border-radius: 3px; background: #0a0e15; position: relative; overflow: hidden; }
.meter i {
  position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
  background: linear-gradient(to top, var(--accent) 0%, var(--accent) 62%, var(--hot) 80%, var(--clip) 96%);
  background-size: 100% var(--h, 300px); background-position: bottom;
}
.fader { position: relative; width: 34px; touch-action: none; cursor: grab; border-radius: 6px; }
.fader:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.fader .rail { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 4px; transform: translateX(-50%); background: #0a0e15; border-radius: 2px; }
.fader .fill { position: absolute; left: 50%; bottom: 10px; width: 4px; transform: translateX(-50%); background: var(--accent); border-radius: 2px; box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
.fader .tick { position: absolute; left: 3px; right: 3px; height: 1px; background: var(--line); }
.fader .tick.zero { background: var(--muted); left: 0; right: 0; }
.fader .cap {
  position: absolute; left: 0; right: 0; height: 22px; margin-bottom: -11px; border-radius: 5px;
  background: linear-gradient(180deg, #e9eef6, #9aa6b8); box-shadow: 0 3px 8px #0009, inset 0 -2px 0 #6c7789;
}
.fader .cap::after { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; height: 2px; background: #1b2433; }
.label { font: 600 13px/1.15 var(--display); text-align: center; letter-spacing: .02em; overflow-wrap: anywhere; }
.label small { display: block; font: 400 10px/1.3 var(--mono); color: var(--muted); letter-spacing: 0; margin-top: 2px; }

.bar { display: flex; gap: 8px; }
.chip {
  flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text);
  font: 600 13px/1 var(--display); letter-spacing: .04em; padding: 14px 8px; cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { font: 400 11px/1.4 var(--mono); color: var(--muted); text-align: center; }

.topr { display: flex; align-items: center; gap: 8px; }
.gear { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
.gear:hover, .gear:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }

.pin { display: flex; justify-content: center; gap: 16px; padding-top: 8px; }
.pin span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); transition: background .12s, border-color .12s; }
.pin span.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
.pin.bad span { border-color: var(--clip); background: none; box-shadow: none; animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.pinmsg { text-align: center; font: 400 12px/1 var(--mono); color: var(--muted); margin: 0; }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 300px; width: 100%; margin: 0 auto; }
.key { height: 60px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 22px/1 var(--display); cursor: pointer; }
.key:active { border-color: var(--accent); color: var(--accent); }
.key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.roles { display: flex; flex-direction: column; gap: 8px; }
.role { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.role.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.rolehead { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px; background: none; border: 0; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
.rolehead:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rolehead .name { font: 600 17px/1.1 var(--display); min-width: 0; overflow-wrap: anywhere; }
.rolehead .out { font: 400 11px/1.2 var(--mono); color: var(--muted); text-align: right; }
.roleb { display: flex; flex-direction: column; gap: 14px; padding: 0 14px 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span, .cap2 { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.roleb input, .roleb select {
  width: 100%; min-width: 0; background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 10px; font: 500 15px/1.2 var(--body);
}
.roleb input:focus, .roleb select:focus { outline: none; border-color: var(--accent); }
.chs { display: flex; flex-direction: column; gap: 8px; }
.chrow { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr) 38px; gap: 6px; }
.chrow select { font-size: 13px; padding-inline: 6px; }
.x { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 10px; font-size: 20px; cursor: pointer; }
.x:hover, .x:focus-visible { color: var(--clip); border-color: var(--clip); outline: none; }
.add { background: none; border: 1px dashed var(--line); color: var(--accent); border-radius: 10px; padding: 11px; font: 600 13px/1 var(--display); letter-spacing: .04em; cursor: pointer; }
.add.big { padding: 15px; border-radius: 14px; }
.add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.danger { align-self: flex-start; background: none; border: 0; color: var(--clip); font: 500 13px/1.3 var(--body); padding: 4px 0; cursor: pointer; text-align: left; }
.warn { margin: -6px 0 0; font: 400 12px/1.4 var(--body); color: var(--hot); }
.chip.save { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  background: var(--ok); color: var(--ink); font: 600 14px/1 var(--display); letter-spacing: .04em; padding: 12px 18px; border-radius: 999px; box-shadow: 0 6px 20px #0008;
}

/* ===== Piel estilo consola de TotalMix: gris plano, cabeceras de canal, escala en dB, medidores verdes ===== */
:root {
  --ink: #1b1e22;          /* fondo de la ventana */
  --panel: #2c3137;        /* cuerpo del canal */
  --head: #454c55;         /* cabecera con el nombre */
  --line: #3b4148;
  --well: #15181b;         /* ranura del fader y del medidor */
  --text: #e9ecef;
  --muted: #98a1aa;
  --accent: #1cb4d3;       /* turquesa de los paneles de opciones */
  --orange: #f0952b;       /* acentos naranjas (paneo, selección) */
  --meter: #3ccf4e;
  --hot: #f2d43a;
  --clip: #ef3b3b;
  --ok: #3ccf4e;
  --display: "Roboto Condensed", "Arial Narrow", Tahoma, sans-serif;
  --body: "Roboto Condensed", Tahoma, Verdana, sans-serif;
  --mono: "Roboto Mono", Consolas, Menlo, monospace;
}
body { background: var(--ink); font-size: 15px; }
.app { gap: 14px; }
.brand { letter-spacing: .12em; }
.brand b { color: var(--accent); }
.status { border-radius: 3px; background: var(--panel); border-color: var(--line); }
h1 { font-weight: 700; letter-spacing: 0; }
h1 span { color: var(--accent); }

/* tarjetas de rol = canal de salida de TotalMix */
.grid { gap: 6px; }
.who { background: var(--panel); border: 1px solid #23272c; border-radius: 3px; padding: 0 0 10px; gap: 8px; overflow: hidden; transition: border-color .12s; }
.who:hover, .who:focus-visible { transform: none; border-color: var(--accent); }
.who .name { background: var(--head); padding: 7px 10px; font: 700 16px/1.1 var(--display); }
.who .out, .who .mini { margin-inline: 10px; }
.who .mini i { background: var(--well); border-radius: 1px; }
.who.busy .mini i { background: var(--meter); opacity: .85; }
.who .tag { top: 8px; right: 8px; color: var(--text); background: var(--orange); padding: 2px 4px; border-radius: 2px; font-weight: 500; }

/* canales */
.strips { gap: 3px; }
.strips.scroll { grid-auto-columns: calc((100% - 3px * (var(--n) - 1)) / var(--n)); }
.strip { border-radius: 3px; border: 1px solid #23272c; padding: 0 0 8px; gap: 8px; overflow: hidden; }
.strip.me { border-color: var(--orange); box-shadow: none; }
.strip .label { order: -1; align-self: stretch; background: var(--head); padding: 6px 4px 5px; font: 700 14px/1.1 var(--display); letter-spacing: 0; }
.strip.me .label { background: #5a4430; }
.strip .label small { font: 400 10px/1.2 var(--mono); color: #c3cad1; margin-top: 1px; }
.strip .db { order: 2; background: var(--well); border-radius: 2px; padding: 4px 6px; font: 500 13px/1 var(--mono); min-width: 58px; text-align: center; }
.body { gap: 4px; }
.meter { width: 5px; border-radius: 0; background: var(--well); }
.meter i { background: linear-gradient(to top, var(--meter) 0%, var(--meter) 72%, var(--hot) 86%, var(--clip) 97%); background-size: 100% var(--h, 300px); background-position: bottom; }
.fader { width: 42px; }
.fader .rail { width: 3px; background: var(--well); border-radius: 0; }
.fader .fill { display: none; }
.fader .tick { left: 0; right: auto; width: 6px; background: #5b636c; }
.fader .tick.zero { width: 10px; background: var(--text); }
.fader .tick b { position: absolute; left: 8px; top: -6px; font: 400 9px/1 var(--mono); color: var(--muted); }
.fader .tick.zero b { color: var(--text); left: 12px; }
.fader .cap {
  left: 7px; right: 7px; height: 30px; margin-bottom: -15px; border-radius: 2px;
  background: repeating-linear-gradient(180deg, #d9dde1 0 3px, #b9bfc5 3px 4px);
  box-shadow: 0 2px 4px #000a, inset 0 0 0 1px #8b939b;
}
.fader .cap::after { left: 0; right: 0; top: 14px; height: 2px; background: #2a2f35; }

/* botones */
.back, .pg, .chip, .key, .x, .add, .gear { border-radius: 3px; }
.back { background: var(--panel); }
.pg { background: var(--panel); color: var(--text); }
.chip { background: var(--head); border-color: #23272c; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--orange); color: #1b1e22; border-color: var(--orange); }
.chip.save { background: var(--accent); color: #0d2830; }
.key { background: var(--panel); }
.role { border-radius: 3px; }
.role.open { border-color: var(--accent); }
.rolehead { background: var(--head); }
.roleb { padding-top: 12px; }
.roleb input, .roleb select { border-radius: 2px; background: var(--well); }
.toast { border-radius: 3px; }
.tip { margin: -6px 0 0; font: 400 12px/1.4 var(--body); color: var(--muted); }
.rolehead .auto { margin-left: 6px; font: 500 10px/1 var(--mono); color: #0d2830; background: var(--accent); padding: 2px 4px; border-radius: 2px; vertical-align: 2px; }
.roleb input::placeholder { color: #6f7880; }
.gear { border-radius: 3px; background: var(--panel); }

@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .who { transition: none; } }

#err { color: var(--clip); font: 500 13px/1.4 var(--body); text-align: center; margin: 0; min-height: 1em; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="/app.js"></script>
</body>
</html>
